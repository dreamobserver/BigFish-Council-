name: ci

on:
  push:
    branches: ["main", "fix/**", "review/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 在无显示器 Linux 上要这几个 .so 才能 import（GUI 冒烟用 offscreen）
      - name: Linux GUI libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0

      # 3.11 用精确锁（可复现）；其余小版本用声明式范围——lock 是按 3.11
      # 生成的传递依赖快照，换 Python 小版本时某些包未必有对应 wheel。
      - name: Install dependencies (locked, py3.11)
        if: matrix.python == '3.11'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install pyflakes

      - name: Install dependencies (range)
        if: matrix.python != '3.11'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyflakes

      - name: Static check
        run: python -m pyflakes bigfish tools tests

      - name: Byte-compile
        run: python -m compileall -q bigfish tools tests

      # 全量单测。Windows 上没有 DISPLAY 也要跑 GUI 冒烟，所以统一用 offscreen。
      # Linux 的 GL/xcb 依赖靠上面 apt 装的系统包解决，不需要手写 LD_LIBRARY_PATH；
      # 本仓库自带的 .local/libbfc 不入库，CI 也不依赖它。
      - name: Unit tests
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Unit tests
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Self check
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/selfcheck.py

      - name: GUI smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/gui_smoke.py

  security-note:
    name: 边界自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 不装依赖的轻量检查：确认没有把凭据/数据库/构建产物带进仓库
      - name: No secrets or artifacts committed
        run: |
          set -e
          echo "--- 禁止入库的后缀 ---"
          bad=$(git ls-files | grep -Ei '\.(db|db-wal|db-shm|key|pem|pfx|zip|exe|msi)$' || true)
          if [ -n "$bad" ]; then echo "出现了不该入库的文件:"; echo "$bad"; exit 1; fi
          echo "--- 禁止入库的凭据形态 ---"
          hits=$(git grep -nE '(ghp_[A-Za-z0-9]{20,}|bfc_(tk|ex|rv|ad)_[A-Za-z0-9_-]{10,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . || true)
          if [ -n "$hits" ]; then echo "疑似凭据:"; echo "$hits"; exit 1; fi
          echo "OK"
